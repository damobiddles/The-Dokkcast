# Rebuilds the Netlify site every few hours so new Acast episodes (and any scheduled blog posts) appear
# without anyone pushing a change. It only calls a private Netlify "build hook"; nothing is built here.
#
# One-off setup: in Netlify create a build hook (Site configuration > Build & deploy > Build hooks), then add its
# URL to this repo as a secret named NETLIFY_BUILD_HOOK (Settings > Secrets and variables > Actions).
# Until that secret exists the job fails, so GitHub emails a failed-run notice instead of silently doing nothing.
name: Rebuild site

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours at 17 minutes past (times are UTC)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

concurrency:
  group: rebuild-site
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ask Netlify to rebuild
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::The NETLIFY_BUILD_HOOK secret is not set, so Netlify was not asked to rebuild and new episodes won't appear."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 -X POST -d '{}' "$HOOK"
          echo "Netlify build triggered."
