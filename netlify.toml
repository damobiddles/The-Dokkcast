# Netlify settings for The Dokkcast. The generated HTML is committed, so no build step is needed.
[build]
  publish = "."

# Keep source folders out of the public site.
[[redirects]]
  from = "/pages/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/partials/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
